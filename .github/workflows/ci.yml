name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  foundry:
    name: Foundry (fmt + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: forge fmt --check
        run: forge fmt --check

      - name: forge test
        run: forge test -vv
